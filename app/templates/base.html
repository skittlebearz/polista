<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Polista</title>
    <link rel="icon" type="image/png" href="/static/favicon.png?v={{ static_v }}">
    <link rel="stylesheet" href="/static/app.css?v={{ static_v }}">
    <script src="/static/htmx.min.js?v={{ static_v }}"></script>
    <script src="/static/lines.js?v={{ static_v }}"></script>
  </head>
  <body>
    <header>
      <a class="brand" href="/ui">
        <img class="header-logo" src="/static/logo.png?v={{ static_v }}" alt="">
        <span class="brand-name">Polista</span>
      </a>
      <div class="header-actions">
        {% include "_menu.html" %}
      </div>
    </header>
    <main>
      {% include "panel.html" %}
      {# Outside #panel on purpose: responses that swap the whole panel would
         otherwise take the dialog container with them, leaving htmx nowhere to
         render the next confirmation. #}
      <div id="dialog"></div>
    </main>
  </body>
</html>
